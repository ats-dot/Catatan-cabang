name: Buat Rangkuman Kode
on:
  push:
    paths-ignore:
      - 'graphify-out/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rangkum:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Siapkan alat Graphify
        run: pip install graphifyy

      - name: Buat rangkuman otomatis
        run: graphify extract . --code-only

      - name: Simpan hasil rangkuman ke dalam repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphify-out/GRAPH_REPORT.md
          git commit -m "Update rangkuman kode [skip ci]" || exit 0
          git push
